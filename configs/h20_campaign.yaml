# =============================================================================
# 8×H20 campaign config  (the SINGLE place to edit what runs)
# -----------------------------------------------------------------------------
# Everything here is FP32 / MLIP-only — H20 has crippled FP64 so NO new
# DFT/DFPT/EPW runs on this box. The four groups map to the NCS roadmap §0b·2(a):
#   e1        -> E1 benchmark atlas (≥6 foundation MLIPs × MDR/Petretto)
#   finetune  -> E3/E4 FC-distillation + anti-forgetting / breadth / LoRA ablations
#   lchannel  -> (L)-channel TMD-family SSCHA screen   (Paper-2 discovery seed)
#   e9_kappa  -> E9 κ (phono3py 3rd-order) MLIP-force part   (impact line)
#
# gen_h20_manifest.py turns this into results/h20/jobs.jsonl; run_campaign.sh
# executes it across 8 GPUs with a work-stealing queue (no idle GPU while work
# remains). Edit freely — the material/model lists are meant to be tuned.
# =============================================================================

runtime:
  ngpu: 8                 # workers = GPUs; one job pinned per GPU at a time
  device: cuda
  omp_threads: 4          # per-job BLAS/OMP cap (8×4 = 32 of 192 cores)
  omp_threads_kappa: 16   # phono3py RTA solve is CPU-bound -> more threads

# --- foundation models for E1 (each needs its OWN conda env; see bootstrap) ---
# key  = phonon_accel.mlip_calc.get_calculator() name
# env  = conda env that has this model + the phonon stack (phonopy/ase)
# distill_base: this model is the one we FC-distill in the finetune group
models:
  - {name: mace,      key: mace,      env: phonon,    e1: true, distill_base: true}
  - {name: mace-omat, key: mace-omat, env: phonon,    e1: true}
  - {name: sevennet,  key: sevennet,  env: sevennet,  e1: true}
  - {name: mattersim, key: mattersim, env: mattersim, e1: true}
  - {name: orb,       key: orb,       env: orb,       e1: true}
  - {name: chgnet,    key: chgnet,    env: chgnet,    e1: true}

# --- E1: full-band MLIP-vs-DFPT benchmark over a stratified MDR subset --------
e1:
  pool_size: 100          # capped to the 109 locally-cached MDR materials (network to MDR source is blocked)
  pool_file: data/benchmark/e1_pool.txt
  nshards: 12             # per-model parallelism: 6 models × 12 = 72 E1 jobs
  mesh: 24
  displacement: 0.03

# --- E3/E4: FC-distillation fine-tunes (reuses scripts/run_one_job.sh) --------
# train sets (B16/B32/B64...) are resolved from scripts/campaign_materials.sh.
finetune:
  base_model: small       # MACE foundation size to distill
  hold: "mp-7140 mp-984 mp-1138 mp-2605 mp-20351 mp-390"
  ncfg: 30                # distilled configs per material
  epochs: 50
  jobs:
    - {tag: b16,        train: B16, mode: pt1000, seeds: [1, 2, 3]}   # breadth + seed error bars
    - {tag: b32,        train: B32, mode: pt1000, seeds: [1]}
    - {tag: b64,        train: B64, mode: pt1000, seeds: [1]}         # headline breadth
    - {tag: b16single,  train: B16, mode: single, seeds: [1]}         # no anti-forgetting (ablation)
    - {tag: b16lora8,   train: B16, mode: lora8,  seeds: [1]}         # PEFT ablation
  # the canonical distilled model Wave B (lchannel/e9/e1-after) consumes:
  canon: {tag: b64, mode: pt1000, seed: 1}

# --- (L)-channel: TMD-family SSCHA screen  (Paper-2 discovery seed) -----------
# triage = cheap harmonic dispersion (run for ALL, incl. controls) -> ranking;
# sscha  = full free-energy-Hessian T-evolution (only the known/likely-CDW set).
# a/thickness are literature monolayer starts; each is relaxed before fc2.
lchannel:
  supercell: [4, 4, 1]
  displacement: 0.03
  sscha_temps: [50, 100, 150, 200, 300]
  sscha_nconfigs: 200
  sscha_maxpop: 5
  model_type: mace
  foundation_model: medium        # Wave A screens with the foundation MLIP
  materials:
    - {name: NbSe2,    formula: NbSe2, polytype: 2H, a: 3.44, thickness: 3.34, sscha: true,  cdw_exp_K: 145}
    - {name: NbS2,     formula: NbS2,  polytype: 2H, a: 3.33, thickness: 3.00, sscha: true,  cdw_exp_K: null}
    - {name: 2H-TaS2,  formula: TaS2,  polytype: 2H, a: 3.31, thickness: 3.00, sscha: true,  cdw_exp_K: 75}
    - {name: 1T-TaS2,  formula: TaS2,  polytype: 1T, a: 3.36, thickness: 2.90, sscha: true,  cdw_exp_K: 350}
    - {name: 2H-TaSe2, formula: TaSe2, polytype: 2H, a: 3.43, thickness: 3.30, sscha: true,  cdw_exp_K: 122}
    - {name: 1T-TiSe2, formula: TiSe2, polytype: 1T, a: 3.53, thickness: 2.90, sscha: true,  cdw_exp_K: 200}
    - {name: 1T-TiS2,  formula: TiS2,  polytype: 1T, a: 3.40, thickness: 2.70, sscha: false, cdw_exp_K: null}
    - {name: 1T-VSe2,  formula: VSe2,  polytype: 1T, a: 3.34, thickness: 3.00, sscha: true,  cdw_exp_K: 110}
    - {name: 1T-VS2,   formula: VS2,   polytype: 1T, a: 3.18, thickness: 2.95, sscha: false, cdw_exp_K: null}
    - {name: MoS2,     formula: MoS2,  polytype: 2H, a: 3.18, thickness: 3.13, sscha: false, cdw_exp_K: null}   # gapped control
    - {name: WSe2,     formula: WSe2,  polytype: 2H, a: 3.28, thickness: 3.36, sscha: false, cdw_exp_K: null}   # gapped control

# --- E9: κ (lattice thermal conductivity) via MLIP forces + phono3py RTA ------
e9_kappa:
  mesh: 19
  supercell: [2, 2, 2]
  temps: [200, 300, 400, 500, 600]
  model_type: mace
  foundation_model: medium
  materials:    # covalent reference set with well-known κ (the apples-to-apples impact line)
    - {name: Si,   structure: diamond,    a: 5.43,  kappa_exp_300K: 140}
    - {name: Ge,   structure: diamond,    a: 5.658, kappa_exp_300K: 60}
    - {name: C,    structure: diamond,    a: 3.567, kappa_exp_300K: 2200}
    - {name: GaAs, structure: zincblende, a: 5.653, kappa_exp_300K: 45}
    - {name: BAs,  structure: zincblende, a: 4.777, kappa_exp_300K: 1300}

# Which Wave-B (distilled-model) re-runs to do once the canon model is trained.
waveB:
  lchannel_distilled: true   # re-screen the TMD family with the distilled model
  e9_distilled: false        # κ with distilled model (usually foundation is enough)
  e1_after: true             # full-pool E1 benchmark of the distilled model (the "after" row)
